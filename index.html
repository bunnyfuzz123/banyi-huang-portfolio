<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projects.css">
</head>

<body>

    <nav>
        <a class="menu-toggle" aria-label="switch to spatial view" href="spatial.html">
            <img src="assets/media/sigils/Asset 4KAI.png" alt="a sigil with a transparent background"></img>
        </a>
    </nav>


    <main id="project-grid">
        <div id="grid-container">
        <div id="project-overlay">

    <div class="project-header">

        <div class="project-meta">
            <h4 id="project-title"></h4>

            <div id="project-type"></div>

        </div>

    </div>

    <div class="project-body">

    </div>

</div>
     <div id="about-overlay">
            <div>
                <h4 id="about-title">About</h4>
                <br>
                <div id="about-bio">
                    <p></p>
                </div>
              
                <div id="selected-exhibitions">

                    <br>
                    <div id="exhibition-list"></div>
                </div>
              

                <div id="selected-talks">
                    <h4>Selected talks</h4>
                    <br>
                    <div id="talks-list"></div>
                </div>
                <br>
                <br>
                <div id="contact-section">
                    <h4>Contact</h4>
                    <br>

                    <br>
                    <a href="mailto: info@banyihuang.com">info@banyihuang.com</a>
                </div>
                <div id="about-links">

                </div>
            </div>

         </div>

        </div>
